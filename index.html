<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<title>Buildwright v0.1</title>
<!-- BUILDWRIGHT v0.1 — Private Offline Playtest Sandbox.
     One self-contained file: no network, no libraries, no fonts, no telemetry.
     Source sections (search for the banners): CONFIGURATION, DATA DEFINITIONS,
     CHARACTER MODEL, LIFEPATH ENGINE, SKILL ENGINE, PREREQUISITE ENGINE, WEB ENGINE,
     NODE PURCHASING, EVENT ENGINE, PLANNING MODE, STORAGE, UI, DEBUGGING, BALANCE STATISTICS. -->
<style>
:root{
  --bg:#060a13; --bg2:#0b1222; --panel:#0f1729; --panel2:#141e34; --line:#223050; --line2:#2d3f66;
  --text:#dfe8f6; --dim:#8b9bb8; --faint:#5a6a88; --accent:#3fd0ff; --accent2:#8ae8ff;
  --good:#4cf0a0; --bad:#ff5f6d; --warn:#ffb547; --plan:#ffb547; --dev:#ff5f6d;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% 10%, #0d1a33 0%, var(--bg) 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:12.5px} .tiny{font-size:11px}
h1,h2,h3{margin:0 0 8px;font-weight:650;letter-spacing:.02em}
h2{font-size:17px} h3{font-size:14px;color:var(--accent2);text-transform:uppercase;letter-spacing:.12em}

/* ---- top bar ---- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
  background:rgba(8,13,26,.92);border-bottom:1px solid var(--line);min-height:52px}
#topbar .brand{font-family:var(--mono);font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--accent)}
#topbar .who{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font:600 11px/1.2 var(--mono);letter-spacing:.06em;border:1px solid var(--line2);white-space:nowrap}
.badge.live{color:var(--good);border-color:rgba(76,240,160,.45);background:rgba(76,240,160,.08)}
.badge.plan{color:#1a1000;background:var(--plan);border-color:var(--plan)}
.badge.wp{color:var(--accent2)} .badge.neg{color:var(--bad);border-color:var(--bad)}
.iconbtn{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;font-size:18px}

#banner{flex:0 0 auto}
.planbar{background:repeating-linear-gradient(135deg,#3a2600 0 12px,#2c1d00 12px 24px);border-bottom:2px solid var(--plan);
  color:var(--plan);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600;font-size:13px}
.planbar .grow{flex:1;min-width:180px}

#view{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#view.webmode{overflow:hidden}
.page{padding:12px 12px 90px;max-width:900px;margin:0 auto}

/* ---- tabs ---- */
#tabs{flex:0 0 auto;display:flex;background:rgba(8,13,26,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;color:var(--dim);font-size:11px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
#tabs button .i{font-size:19px;line-height:1}
#tabs button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
#tabs button.dev.on{color:var(--dev);box-shadow:inset 0 2px 0 var(--dev)}

/* ---- generic ---- */
.card{background:linear-gradient(180deg,var(--panel),#0c1424);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px}
.card.dev{border-color:rgba(255,95,109,.45)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1}
.btn{min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:14px}
.btn.primary{background:linear-gradient(180deg,#1ea7d6,#127aa3);border-color:#40c9f5;color:#fff}
.btn.good{background:#0f3b2a;border-color:var(--good);color:var(--good)}
.btn.danger{background:#3a1117;border-color:var(--bad);color:#ffb3ba}
.btn.warn{background:#3a2a0c;border-color:var(--warn);color:var(--warn)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled,.btn.off{opacity:.45}
.btn.block{width:100%}
input[type=text],input[type=number],input[type=search],select,textarea{background:#08101f;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
textarea{font:12px/1.4 var(--mono);min-height:160px}
input[type=number]{width:90px}
label.field{display:block;margin:0 0 10px} label.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#0a1324;border:1px solid var(--line2);font-size:12px;margin:2px 3px 2px 0}
.chip.x{padding-right:3px} .chip.x button{border:0;background:#1b2743;border-radius:999px;width:24px;height:24px;color:var(--dim)}
.chip.sup{opacity:.5;text-decoration:line-through}
.chip.test{border-color:rgba(255,181,71,.5);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kv > div{background:#0a1324;border:1px solid var(--line);border-radius:8px;padding:8px}
.kv .k{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.kv .v{font:700 20px/1.2 var(--mono)}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.attrs{grid-template-columns:repeat(6,1fr)}}
.attr{background:#0a1324;border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.attr .n{font:600 11px var(--mono);color:var(--dim);letter-spacing:.1em}
.attr .s{font:700 22px/1.1 var(--mono)} .attr .m{font:12px var(--mono);color:var(--accent2)}
.attr .delta{font-size:11px}
.list > *{border-top:1px solid var(--line);padding:10px 0} .list > *:first-child{border-top:0}
.muted-box{background:#0a1324;border:1px dashed var(--line2);border-radius:8px;padding:10px}
.warnbox{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.5);border-radius:10px;padding:12px;color:#ffe2b0}
.dangerbox{background:rgba(255,95,109,.08);border:1px solid rgba(255,95,109,.55);border-radius:10px;padding:12px}
details > summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600;color:var(--accent2)}
.explain .ln{font-size:13px;padding:2px 0;display:flex;gap:6px}
.explain .ln .m{flex:0 0 16px;font-weight:700}
.explain .ok .m{color:var(--good)} .explain .no .m{color:var(--bad)} .explain .grp{color:var(--dim)}
.explain h4{margin:10px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
table.t{width:100%;border-collapse:collapse;font-size:13px} table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:8px;background:#0a1324;border-radius:4px;overflow:hidden} .bar > i{display:block;height:100%}

/* ---- lifepath ---- */
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.stepper button{flex:0 0 auto;border:1px solid var(--line2);background:#0a1324;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--dim);min-height:36px}
.stepper button.on{border-color:var(--accent);color:var(--accent);background:#0b2233}
.stepper button.done::before{content:"✓ ";color:var(--good)}
.opt{display:block;width:100%;text-align:left;background:linear-gradient(180deg,var(--panel),#0c1424);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(63,208,255,.18)}
.opt.na{opacity:.55;border-style:dashed}
.opt .t{font-weight:700;font-size:15.5px} .opt .d{color:var(--dim);font-size:13px;margin:2px 0 6px}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font:12px var(--mono);padding:2px 7px;border-radius:6px;background:#0a1a2c;border:1px solid var(--line)}
.fx .a{color:#ffd28a} .fx .s{color:var(--accent2)} .fx .g{color:#c7b3ff} .fx .e{color:#ff9fcf} .fx .q{color:#a6e35a}
.lpnav{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(6,10,19,.95);border-top:1px solid var(--line)}
.lpnav .btn{flex:1}

/* ---- web ---- */
#webwrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
#webwrap svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.webctl{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.webctl button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:rgba(15,23,41,.9);font-size:20px;font-weight:700}
.webtop{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;z-index:3;flex-wrap:wrap}
.webtop input{flex:1;min-width:120px;background:rgba(8,16,31,.9)} .webtop select{width:auto;flex:0 0 auto;background:rgba(8,16,31,.9)}
.legend{position:absolute;left:8px;bottom:12px;z-index:3;background:rgba(8,13,26,.9);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;max-width:230px}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend svg{width:18px;height:18px;flex:0 0 18px}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.n-available .ring{animation:pulse 1.6s ease-in-out infinite}
.lowzoom .lbl.sec{display:none}
.minimap{position:relative;height:340px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#050910}

/* ---- sheet / modal / toast ---- */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;background:#0c1426;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
#sheet.open{transform:none}
#sheet .grab{flex:0 0 auto;padding:8px 12px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#sheet .grab::before{content:"";position:absolute;left:50%;top:5px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line2)}
#sheet .body{overflow:auto;padding:12px 12px max(18px,env(safe-area-inset-bottom))}
@media(min-width:900px){#sheet{left:auto;right:12px;bottom:12px;width:420px;border-radius:16px;max-height:calc(100dvh - 90px);border:1px solid var(--line2)}}
#modal{position:fixed;inset:0;background:rgba(2,5,10,.72);z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .box{background:#0e1628;border:1px solid var(--line2);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:90dvh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center} #modal .box{border-radius:16px}}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);opacity:0;pointer-events:none;background:#12203a;border:1px solid var(--accent);
  color:var(--text);padding:10px 14px;border-radius:12px;max-width:min(92vw,560px);font-size:13.5px;z-index:50;transition:all .2s ease;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%)}
.devhead{color:var(--dev);font:700 12px var(--mono);letter-spacing:.14em}
.sk{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.sk .nm{font-weight:650} .sk .tot{font:700 20px var(--mono);text-align:right}
.tier{font:600 10.5px var(--mono);padding:2px 6px;border-radius:5px;letter-spacing:.06em;border:1px solid var(--line2)}
.tier-Untrained{color:var(--faint)} .tier-Trained{color:#9fd8ff;border-color:#2e6d93} .tier-Proficient{color:var(--good);border-color:#2a7d5a}
.tier-Expert{color:#ffd166;border-color:#8a6d20} .tier-Master{color:#ff8ad8;border-color:#8a2f6e}
.marks{display:flex;gap:3px;margin:4px 0} .marks i{flex:1;height:8px;border-radius:2px;background:#132039;border:1px solid var(--line)} .marks i.on{background:var(--accent);border-color:var(--accent)}
.stepbtn{width:40px;height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;font-size:16px}
.man{padding:10px 0;border-top:1px solid var(--line)} .man:first-child{border-top:0}
.star{border:0;background:none;font-size:20px;width:40px;height:40px}
.domdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="banner"></div>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="sheet"><div class="grab"><div class="grow" id="sheetTitle"></div><button class="iconbtn" data-act="closeSheet" aria-label="Close">✕</button></div><div class="body" id="sheetBody"></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* =====================================================================
   CONFIGURATION
   Every value here is a PLAYTEST VALUE — NOT FINAL BUILDWRIGHT CANON.
   All of it can be changed live from the Developer tab (saved with the
   backup). Edit these defaults to change what a fresh prototype starts with.
   ===================================================================== */
const DEFAULT_CONFIG = {
  // PLAYTEST VALUE — Web Points a level-1 character starts with
  startingWebPoints: 5,

  // PLAYTEST VALUES — Web Points granted when reaching each level (level 2+).
  // Level 1 grants startingWebPoints only.
  webPointBands: [
    { min: 1,  max: 5,  perLevel: 5 },
    { min: 6,  max: 10, perLevel: 7 },
    { min: 11, max: 15, perLevel: 7 },  // PLAYTEST VALUE
    { min: 16, max: 20, perLevel: 8 },  // PLAYTEST VALUE
    { min: 21, max: 40, perLevel: 8 }   // PLAYTEST VALUE — post-20 cap
  ],

  levelCap: 40,               // hard cap (current design rule)

  // PLAYTEST VALUES — mastery states are qualifications, not bonuses.
  // Nodes reference tier NAMES, so thresholds can be rebalanced here.
  masteryTiers: [
    { name: "Untrained",  min: 0 },
    { name: "Trained",    min: 10 },
    { name: "Proficient", min: 20 },
    { name: "Expert",     min: 30 },
    { name: "Master",     min: 40 }
  ],
  masteryBasis: "rank",       // "rank" (skill value) or "total" (value + attribute mod)

  skillSoftCap: 40,           // PLAYTEST VALUE — soft ceiling, warns only
  progressMarksPerIncrease: 10,
  skillIncreasePerFill: 1,
  maxMarksBetweenLongRests: 1,

  // PLAYTEST VALUES — suggested minimum DC for a check to earn a Progress Mark, by tier
  progressDCByTier: { Untrained: 8, Trained: 15, Proficient: 22, Expert: 30, Master: 38 },

  includeAttributeModInSkill: true, // displayed modifier = rank + attribute modifier + bonuses
  flexibleAttributePoints: 2,       // PLAYTEST VALUE — end-of-lifepath adjustment
  baseAttribute: 10,

  // PLAYTEST VALUES — derived stats (placeholder math)
  hpBase: 10, hpPerLevel: 5, baseAC: 10, baseSpeed: 30,

  // Fog of war (steps from anything you own)
  fullVisibilityDepth: 2,     // 1 = adjacent only; 2 = one more readable layer
  partialVisibilityDepth: 3,  // silhouettes beyond that

  respecMode: "depthLimited", // "depthLimited" | "free" | "disabled" (disabled only warns)
  forcedPurchasesCostPoints: true,

  // PLAYTEST VALUES — underqualified maneuver guidance (display only)
  underqualifiedPenalty: "Disadvantage on the maneuver's roll, or its save DC is reduced by 3 (DM's choice).",
  parryLoseDamageMultiplier: 0.5,

  // Node price edits made in the inspector land here: { nodeId: cost }
  costOverrides: {},

  // Web layout
  ringSpacing: 70,
  ringBase: 90
};

let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
/* =====================================================================
   DATA DEFINITIONS
   Everything below is status "TEST" prototype content. Species, factions
   and lore are placeholders — replace from the Aegis / Delvian / Khaganate /
   Free Trade Alliance codices. Nothing here is setting canon.
   ===================================================================== */

const DOMAINS = [
  { id: "BOND",       color: "#ff6fb1", blurb: "Companions, teams, partners, protection" },
  { id: "MIGHT",      color: "#ff4d4d", blurb: "Martial technique, weapons, fighting styles" },
  { id: "PARACAUSAL", color: "#b073ff", blurb: "Phenomena that break causality" },
  { id: "SPIRIT",     color: "#fff08a", blurb: "Will, resolve, the psyche" },
  { id: "MIND",       color: "#3fd0ff", blurb: "Analysis, memory, knowledge, cognition" },
  { id: "PASSAGE",    color: "#3ff0b0", blurb: "Movement, piloting, navigation" },
  { id: "FORM",       color: "#ff9a3c", blurb: "Body, endurance, biology, augmentation" },
  { id: "FORGE",      color: "#c9a24a", blurb: "Engineering, fabrication, technology" },
  { id: "GUILE",      color: "#7080ff", blurb: "Stealth, deception, security" },
  { id: "SOCIETY",    color: "#a6e35a", blurb: "Influence, command, institutions" }
];
const DOMAIN_BY_ID = Object.fromEntries(DOMAINS.map((d, i) => [d.id, Object.assign({ index: i }, d)]));

const ATTRS = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];
const ATTR_NAMES = { STR: "Strength", DEX: "Dexterity", CON: "Constitution", INT: "Intelligence", WIS: "Wisdom", CHA: "Charisma" };

/* ---------- SKILLS (TEST list, 22 representative) ---------- */
const SKILLS = [
  { id: "Athletics", attr: "STR" },
  { id: "Close Combat", attr: "STR", note: "TEST combat skill used by melee maneuvers" },
  { id: "Acrobatics", attr: "DEX" },
  { id: "Marksmanship", attr: "DEX", note: "TEST combat skill used by firearm maneuvers" },
  { id: "Sleight of Hand", attr: "DEX" },
  { id: "Stealth", attr: "DEX" },
  { id: "Piloting", attr: "DEX", note: "Spacecraft & aircraft — distinct from Vehicle Operation" },
  { id: "Vehicle Operation", attr: "DEX" },
  { id: "Engineering", attr: "INT" },
  { id: "Advanced Engineering", attr: "INT",
    unlock: { any: [{ mastery: "Engineering", tier: "Proficient" }, { node: "forge_adv" }] },
    note: "Unlocked by Proficient Engineering or the Advanced Engineering Access node" },
  { id: "Computers", attr: "INT" },
  { id: "Explosives", attr: "INT" },
  { id: "Astrophysics", attr: "INT" },
  { id: "Investigation", attr: "INT" },
  { id: "Xenology", attr: "INT" },
  { id: "Paracausal Theory", attr: "INT" },
  { id: "Medicine", attr: "WIS" },
  { id: "Perception", attr: "WIS" },
  { id: "Insight", attr: "WIS" },
  { id: "Survival", attr: "WIS" },
  { id: "Deception", attr: "CHA" },
  { id: "Persuasion", attr: "CHA" },
  { id: "Intimidation", attr: "CHA" },
  { id: "Command", attr: "CHA" }
];
const SKILL_BY_ID = Object.fromEntries(SKILLS.map(s => [s.id, s]));

/* ---------- SPECIES (TEST placeholders — replace from codices) ---------- */
const SPECIES = [
  { id: "human", name: "Human", status: "TEST",
    desc: "Baseline humanity. Placeholder values — replace from the Aegis Commonwealth Codex.",
    attrs: {}, flex: 1, speed: 30,
    ages: { childhood: "0–12", adolescence: "13–19", adulthood: "20+" },
    traits: ["Adaptable (TEST): +1 extra flexible attribute point"], tags: ["human"] },
  { id: "delvian", name: "Delvian (placeholder)", status: "TEST",
    desc: "PLACEHOLDER Delvian profile for architecture testing — slower maturation, crystal affinity. Replace from the Delvian Empire Codex.",
    attrs: { WIS: 2, INT: 1, STR: -1 }, flex: 0, speed: 30,
    ages: { childhood: "0–30 (TEST)", adolescence: "31–60 (TEST)", adulthood: "61+ (TEST)" },
    traits: ["Crystal Affinity (TEST): native access to crystal-technology branches"], tags: ["delvian", "crystal_affinity"] },
  { id: "khaganate", name: "Khaganate Congenate (placeholder)", status: "TEST",
    desc: "PLACEHOLDER Congenate profile for architecture testing — hardy, fast-maturing. Replace from the Khaganate Codex.",
    attrs: { CON: 2, STR: 1, CHA: -1 }, flex: 0, speed: 30,
    ages: { childhood: "0–8 (TEST)", adolescence: "9–14 (TEST)", adulthood: "15+ (TEST)" },
    traits: ["Hardy (TEST): unlocks Congenate Hardiness in FORM"], tags: ["khaganate", "congenate"] }
];
const SPECIES_BY_ID = Object.fromEntries(SPECIES.map(s => [s.id, s]));

/* ---------- ACCESS CATALOG: factions, associations, teachers, knowledge, gear ---------- */
const ACCESS = {

          exists (instantiation condition — conditional content),

          mr (maneuver mastery requirement {skill, tier}), parentMode "all"     */

    req: x.req || null, exists: x.exists || null, reveal: x.reveal || null, op: x.op || null,
    grants: x.g || {}, masteryReq: x.mr || null, parentMode: x.parentMode || "any",
    status: "TEST"
  });
}

/* =====================================================================
   UTILITIES
   ===================================================================== */
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const attrMod = v => Math.floor((v - 10) / 2);
const signed = n => (n >= 0 ? "+" : "") + n;
function nodeCost(n) { const o = CONFIG.costOverrides && CONFIG.costOverrides[n.id]; return (o !== undefined && o !== null && o !== "") ? Number(o) : n.cost; }
function labelFor(kind, id) {
  if (kind === "node") return (NODE_BY_ID[id] || {}).name || id;
  if (kind === "event") return (EVENT_BY_ID[id] || {}).name || id;
  if (kind === "species") return (SPECIES_BY_ID[id] || {}).name || id;
  if (ACCESS_BY_ID[id]) return ACCESS_BY_ID[id].name;
  return id;
}

/* =====================================================================
   SKILL ENGINE (tiers)
   ===================================================================== */
function tiers() { return CONFIG.masteryTiers.slice().sort((a, b) => a.min - b.min); }
function tierIndex(name) { return tiers().findIndex(t => t.name.toLowerCase() === String(name).toLowerCase()); }
function tierOf(value) { let t = tiers()[0]; for (const x of tiers()) if (value >= x.min) t = x; return t.name; }
function nextTier(value) { return tiers().find(t => t.min > value) || null; }

/* =====================================================================
   PREREQUISITE ENGINE
   One evaluator for lifepath options, node prereqs, existence, reveal,
   operational requirements, and skill unlocks. Returns ok + explanation.
   ctx: { attrs, rank(skill), total(skill), tags, assoc, knowledge,
          equipment, aug, events, species, history, level, hasNode(id) }
   ===================================================================== */
function evalExpr(expr, ctx, indent) {
  indent = indent || 0;
  if (!expr) return { ok: true, lines: [] };
  if (Array.isArray(expr)) expr = { all: expr };
  const L = (ok, text) => ({ ok, lines: [{ ok, text, indent }] });

  if (expr.all || expr.any) {
    const list = expr.all || expr.any;
    const subs = list.map(e => evalExpr(e, ctx, indent + 1));
    const ok = expr.all ? subs.every(s => s.ok) : subs.some(s => s.ok);
    if (list.length === 1) return evalExpr(list[0], ctx, indent);
    return { ok, lines: [{ ok, text: expr.all ? "All of:" : "Any one of:", indent, group: true }].concat(...subs.map(s => s.lines)) };
  }
  if (expr.not) {
    const s = evalExpr(expr.not, ctx, indent + 1);
    return { ok: !s.ok, lines: [{ ok: !s.ok, text: "None of the following:", indent, group: true }].concat(s.lines.map(l => Object.assign({}, l, { ok: !l.ok }))) };
  }
  if (expr.node !== undefined) return L(ctx.hasNode(expr.node), "Owns node: " + labelFor("node", expr.node));
  if (expr.level !== undefined) return L(ctx.level >= expr.level, `Character level ${expr.level}+ (current ${ctx.level})`);
  if (expr.attr) { const v = ctx.attrs[expr.attr] || 0; return L(v >= expr.min, `${ATTR_NAMES[expr.attr]} ${expr.min}+ (current ${v})`); }
  if (expr.skill) { const v = ctx.rank(expr.skill); return L(v >= expr.min, `${expr.skill} ${expr.min}+ (current ${v})`); }
  if (expr.mastery) {
    const v = CONFIG.masteryBasis === "total" ? ctx.total(expr.mastery) : ctx.rank(expr.mastery);
    const cur = tierOf(v), need = tierIndex(expr.tier);
    const ok = need >= 0 && tierIndex(cur) >= need;
    return L(ok, `${expr.tier} ${expr.mastery} (current: ${cur}, ${v})`);
  }
  if (expr.tag) return L(ctx.tags.has(expr.tag), "Character tag: " + expr.tag);
  if (expr.event) return L(ctx.events.has(expr.event), "Experience: " + labelFor("event", expr.event));
  if (expr.assoc || expr.faction) { const id = expr.assoc || expr.faction; return L(ctx.assoc.has(id), "Association: " + labelFor("assoc", id)); }
  if (expr.knowledge) return L(ctx.knowledge.has(expr.knowledge), "Knowledge: " + labelFor("k", expr.knowledge));
  if (expr.equip) return L(ctx.equipment.has(expr.equip), "Equipment: " + labelFor("e", expr.equip));
  if (expr.aug) return L(ctx.aug.has(expr.aug), "Augmentation: " + labelFor("a", expr.aug));
  if (expr.species) return L(ctx.species === expr.species, "Species: " + labelFor("species", expr.species));
  if (expr.culture) return L(ctx.history.culture === expr.culture, "Culture: " + lifepathName("culture", expr.culture));
  if (expr.history) return L(ctx.history[expr.history] === expr.is, `History (${expr.history}): ${lifepathName(expr.history, expr.is)}`);
  return L(false, "Unknown condition " + JSON.stringify(expr));
}
function lifepathName(stage, id) { const o = (LIFEPATH[stage] || []).find(x => x.id === id); return o ? o.name : id; }

   CHARACTER MODEL
   history = foundational Lifepath choices (read-only once finalized)

}

/* =====================================================================
   LIFEPATH ENGINE
   Replays stages in order against a draft. Earlier choices gate later
   options; invalidated later choices are cleared and reported.
   ===================================================================== */
function blankDraft() {
  const attrs = {}; ATTRS.forEach(a => attrs[a] = CONFIG.baseAttribute);
  return { attrs, skills: {}, tags: new Set(), assoc: new Set(), knowledge: new Set(), equipment: new Set(),
           aug: new Set(), events: new Set(), traits: [], flex: CONFIG.flexibleAttributePoints, species: null, speed: CONFIG.baseSpeed };
}
function draftCtx(d, history) {
  return { attrs: d.attrs, rank: s => d.skills[s] || 0, total: s => d.skills[s] || 0, tags: d.tags, assoc: d.assoc,
           knowledge: d.knowledge, equipment: d.equipment, aug: d.aug, events: d.events, species: d.species,
           history: history, level: 1, hasNode: () => false };
}
function applyPackage(d, p) {
  for (const a in (p.attrs || {})) d.attrs[a] += p.attrs[a];
  for (const s in (p.skills || {})) d.skills[s] = (d.skills[s] || 0) + p.skills[s];
  (p.tags || []).forEach(t => d.tags.add(t));
  (p.assoc || []).forEach(t => d.assoc.add(t));
  (p.knowledge || []).forEach(t => d.knowledge.add(t));
  (p.equipment || []).forEach(t => d.equipment.add(t));
  (p.events || []).forEach(t => { d.events.add(t); ((EVENT_BY_ID[t] || {}).grantsTags || []).forEach(g => d.tags.add(g)); });
  (p.traits || []).forEach(t => d.traits.push(t));
}
function buildLifepath(history) {
  const d = blankDraft();
  const partialHist = {};
  const stages = []; const invalidated = [];
  for (const st of LIFEPATH_STAGES) {
    if (st.id === "final") break;

  c.respec = c.respec || { cap: null }; c.seen = c.seen || []; c.log = c.log || [];
  return c;
}

let toastTimer = null;
function toast(msg, ms) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms || Math.min(6000, 1800 + msg.length * 35));
}
function modal(html) { $("#modalBox").innerHTML = html; $("#modal").classList.add("open"); }

/** Apply a change to the active character (live or planning), log it, save if live. */
function commit(label, fn, opts) {
  const ch = active(); if (!ch) return;
  const r = mutate(ch, label, fn);
  if (!isPlanning()) saveStore();
  if (!(opts && opts.quiet)) toast((isPlanning() ? "[PLAN] " : "") + (r.label || label) + (r.summary ? " — " + r.summary : ""));
  render();
  return r;
}

function fxHtml(p, withCond) {
  if (!p) return "";
  const out = [];
  for (const a in (p.attrs || {})) out.push(`<span class="a">${a} ${signed(p.attrs[a])}</span>`);
  for (const s in (p.skills || {})) out.push(`<span class="s">${esc(s)} ${signed(p.skills[s])}</span>`);
  (p.assoc || []).forEach(x => out.push(`<span class="q">◈ ${esc(labelFor("assoc", x))}</span>`));
  (p.knowledge || []).forEach(x => out.push(`<span class="q">▤ ${esc(labelFor("k", x))}</span>`));
  (p.equipment || []).forEach(x => out.push(`<span class="q">⚙ ${esc(labelFor("e", x))}</span>`));
  (p.events || []).forEach(x => out.push(`<span class="e">✦ ${esc(labelFor("event", x))}</span>`));
  (p.tags || []).forEach(x => out.push(`<span class="g">#${esc(x)}</span>`));
  (p.traits || []).forEach(x => out.push(`<span class="g">${esc(x)}</span>`));
  if (withCond) (p.conditional || []).forEach(c => out.push(`<span class="dim">if ${esc(explainInline(c.if))}: </span>` + fxHtml(c.apply)));
  return out.join("");
}
function explainInline(expr) {
  const r = evalExpr(expr, { attrs: {}, rank: () => 0, total: () => 0, tags: new Set(), assoc: new Set(), knowledge: new Set(), equipment: new Set(), aug: new Set(), events: new Set(), species: null, history: {}, level: 1, hasNode: () => false });
  return r.lines.map(l => l.text).join(" ").replace(/ \(current[^)]*\)/g, "");
}
function explainHtml(res) {
  if (!res || !res.lines.length) return `<div class="ln ok"><span class="m">✓</span><span>No requirement</span></div>`;
  return res.lines.map(l => `<div class="ln ${l.group ? "grp" : l.ok ? "ok" : "no"}" style="padding-left:${l.indent * 14}px">
    <span class="m">${l.group ? "▸" : l.ok ? "✓" : "✗"}</span><span>${esc(l.text)}</span></div>`).join("");
}

  const stepper = LIFEPATH_STAGES.map((s, i) => `<button class="${i === stIdx ? "on" : ""} ${s.id !== "final" && ch.history[s.id] ? "done" : ""}"

  let body = "";
  if (ch.history.finalized) body += `<div class="dangerbox small" style="margin-bottom:10px"><b>Developer override:</b> editing a finalized history. Purchased nodes and skill progress are kept; derived stats will rebuild.</div>`;
  if (App.lastInvalid.length) body += `<div class="warnbox small" style="margin-bottom:10px">Your change invalidated later choices: ${App.lastInvalid.map(x => `<b>${esc(LIFEPATH_STAGES.find(s => s.id === x.stage).name)}</b> (${esc(x.stage === "species" ? labelFor("species", x.id) : lifepathName(x.stage, x.id))})`).join(", ")}. Pick again.</div>`;
  if (st.id !== "final") {
    const stage = lp.stages[stIdx];
    const ages = sp && st.ageKey ? `<span class="chip">${esc(sp.name)} ${st.ageKey}: ${esc(sp.ages[st.ageKey])}</span>` : "";
    body += `<h2>${esc(st.name)} ${ages}</h2>`;

    else body += stage.options.map(o => {
      const sel = ch.history[st.id] === o.opt.id;
      const fx = st.id === "species" ? fxHtml({ attrs: o.opt.attrs, traits: o.opt.traits }) + (o.opt.flex ? `<span class="a">+${o.opt.flex} flexible pt</span>` : "") : fxHtml(o.opt, true);
      return `<button class="opt ${sel ? "sel" : ""} ${o.available ? "" : "na"}" data-act="${o.available ? "lpPick" : "lpNA"}" data-stage="${st.id}" data-id="${o.opt.id}">

      </button>`;
    }).join("");
  } else body += renderLifepathFinal(ch, lp);

  const d = lp.draft; const flex = ch.history.flex;
  const attrsHtml = ATTRS.map(a => { const v = d.attrs[a] + (flex[a] || 0); return `<div class="attr"><div class="n">${a}</div><div class="s">${v}</div><div class="m">${signed(attrMod(v))}</div></div>`; }).join("");
  const sk = Object.entries(d.skills).filter(([, v]) => v).sort((a, b) => b[1] - a[1]);
  const hist = LIFEPATH_STAGES.filter(s => s.id !== "final").map(s => `<div class="row small"><span class="dim" style="width:130px">${esc(s.name)}</span><b>${ch.history[s.id] ? esc(s.id === "species" ? labelFor("species", ch.history[s.id]) : lifepathName(s.id, ch.history[s.id])) : "—"}</b></div>`).join("");
  const stats = `<details class="card" open><summary>Current statistics</summary>
    <div class="attrs" style="margin:8px 0">${attrsHtml}</div>
    <div class="fx">${sk.map(([s, v]) => `<span class="s">${esc(s)} ${v} · ${tierOf(v)}</span>`).join("") || `<span class="dim">No skills yet</span>`}</div>
    <div class="fx" style="margin-top:6px">${fxHtml({ assoc: [...d.assoc], knowledge: [...d.knowledge], equipment: [...d.equipment], events: [...d.events], tags: [...d.tags] })}</div>
    </details><details class="card"><summary>Decision history</summary>${hist}</details>`;
  const last = stIdx === LIFEPATH_STAGES.length - 1;

    <div class="lpnav"><button class="btn" data-act="lpBack" ${stIdx === 0 ? "disabled" : ""}>← Back</button>
    ${last ? `<button class="btn primary" data-act="lpReview">Review Character →</button>` : `<button class="btn primary" data-act="lpNext">Next →</button>`}</div>`;
}

const NODE_R = { entry: 12, small: 7, cap: 9.5, maneuver: 8, style: 11.5, major: 14 };
function nodeFill(n) { return n.domains.length > 1 ? `url(#g_${n.domains[0]}_${n.domains[1]})` : DOMAIN_BY_ID[n.domains[0]].color; }

function webSvg(ch, opts) {
  if (!LAYOUT) computeLayout();
  const D = deriveCharacter(ch); const web = evaluateWeb(ch, D);
  const liveOwned = isPlanning() ? live().owned : null;
  const P = LAYOUT.pos; const R = LAYOUT.maxR;
  const q = (App.filters.search || "").toLowerCase(); const fd = App.filters.domain; const showH = App.filters.showHidden;
  const drawn = id => { if (id === "root") return true; const s = web[id].state; return VISIBLE_STATES.has(s) || s === "partial" || (showH && (s === "hidden" || s === "absent")); };
  const dimNode = n => (fd && !n.domains.includes(fd)) || (q && !n.name.toLowerCase().includes(q) && !(n.description || "").toLowerCase().includes(q));

  // defs: hybrid gradients, glow
  const pairs = new Set(NODES.filter(n => n.domains.length > 1).map(n => n.domains[0] + "_" + n.domains[1]));
  let defs = `<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bgfog"><stop offset="0" stop-color="#10213d" stop-opacity=".9"/><stop offset=".55" stop-color="#0a1428" stop-opacity=".5"/><stop offset="1" stop-color="#060a13" stop-opacity="0"/></radialGradient>`;
  pairs.forEach(p => { const [a, b] = p.split("_"); defs += `<linearGradient id="g_${p}" x1="0" y1="0" x2="1" y2="1"><stop offset=".5" stop-color="${DOMAIN_BY_ID[a].color}"/><stop offset=".5" stop-color="${DOMAIN_BY_ID[b].color}"/></linearGradient>`; });

  let drawnR = CONFIG.ringBase + CONFIG.ringSpacing;
  for (const n of NODES) if (drawn(n.id)) drawnR = Math.max(drawnR, P[n.id].r);
  const LR = Math.min(R + 62, drawnR + 52); App.labelR = LR;
  let bg = `<circle r="${R + 120}" fill="url(#bgfog)"/>`;
  const maxD = Math.max(...Object.values(LAYOUT.depth));
  for (let d = 1; d <= maxD; d++) bg += `<circle r="${CONFIG.ringBase + (d - 1) * CONFIG.ringSpacing}" fill="none" stroke="#1a2a4a" stroke-width="1" stroke-dasharray="${d % 2 ? "2 6" : "1 3"}"/>`;
  DOMAINS.forEach((d, i) => {
    const a = LAYOUT.domAngle(d.id), a2 = a + Math.PI / 10;
    bg += `<line x1="${Math.cos(a2) * 40}" y1="${Math.sin(a2) * 40}" x2="${Math.cos(a2) * (LR + 10)}" y2="${Math.sin(a2) * (LR + 10)}" stroke="#15223d" stroke-width="1"/>`;
    const lr = LR, lx = Math.cos(a) * lr, ly = Math.sin(a) * lr;
    const spent = Object.keys(ch.owned).filter(id => NODE_BY_ID[id] && NODE_BY_ID[id].domains.includes(d.id)).length;
    bg += `<g class="domlabel" opacity="${fd && fd !== d.id ? .3 : 1}"><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${d.color}"
      style="font:700 15px var(--mono);letter-spacing:.14em">${d.id}</text>
      <text x="${lx}" y="${ly + 16}" text-anchor="middle" fill="${d.color}" opacity=".55" style="font:10px var(--mono)">${spent ? spent + " owned" : ""}</text></g>`;
  });

  // edges
  let edges = "";
  for (const n of NODES) {
    if (!drawn(n.id)) continue;
    for (const p of n.parents) {
      if (!drawn(p)) continue;
      const a = P[p], b = P[n.id]; const s1 = web[n.id].state, s0 = p === "root" ? "owned" : web[p].state;
      const col = DOMAIN_BY_ID[n.domains[0]].color;
      const both = (s0 === "owned" || s0 === "inactive") && (s1 === "owned" || s1 === "inactive");
      let st;
      if (both) st = `stroke="${col}" stroke-width="2.6" stroke-opacity=".9"`;
      else if (s1 === "available") st = `stroke="${col}" stroke-width="1.6" stroke-opacity=".55"`;
      else if (s1 === "partial" || s0 === "partial") st = `stroke="#6f84ad" stroke-width="1" stroke-opacity=".22" stroke-dasharray="3 5"`;
      else if (s1 === "faded") st = `stroke="#667" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".5"`;
      else if (s1 === "hidden" || s1 === "absent") st = `stroke="#445" stroke-width=".7" stroke-dasharray="1 4" stroke-opacity=".4"`;
      else st = `stroke="${col}" stroke-width="1.1" stroke-opacity=".25"`;
      const op = dimNode(n) ? .15 : 1;
      edges += `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" ${st} opacity="${op}" ${both ? `filter="url(#glow)"` : ""}/>`;
    }
  }

  // nodes
  let nodes = "";
  for (const n of NODES) {
    if (!drawn(n.id)) continue;
    const r0 = web[n.id]; const s = r0.state; const p = P[n.id]; const rad = NODE_R[n.type] || 9;
    const col = DOMAIN_BY_ID[n.domains[0]].color; const hyp = liveOwned && (s === "owned" || s === "inactive") && !liveOwned[n.id];
    const sel = App.selected === n.id;
    let fill = "#0b1222", stroke = col, sw = 2, dash = "", op = 1, glow = false, label = n.name, lblCls = "lbl", lblFill = "#d7e2f5";
    if (s === "owned") { fill = nodeFill(n); stroke = "#f2f7ff"; sw = 1.6; glow = true; }
    if (s === "inactive") { fill = nodeFill(n); op = .55; stroke = "#ff5f6d"; dash = "3 2"; }
    if (hyp) { stroke = "#ffb547"; dash = "4 2"; sw = 2.4; op = .85; glow = false; }
    if (s === "available") { sw = 2.6; }
    if (s === "locked") { stroke = col; sw = 1.5; op = .5; lblFill = "#8b9bb8"; lblCls = "lbl sec"; }
    if (s === "faded") { stroke = "#6a7088"; dash = "3 2"; op = .5; lblFill = "#6a7088"; lblCls = "lbl sec"; }
    if (s === "partial") { fill = "none"; stroke = "#9db0d6"; sw = 1; dash = "2 2"; op = .35; label = n.name.slice(0, 3) + "···"; lblFill = "#5a6a88"; lblCls = "lbl sec"; }
    if (s === "hidden" || s === "absent") { fill = "none"; stroke = s === "absent" ? "#5a4050" : "#40506a"; sw = 1; dash = "1 2"; op = .45; label = (s === "absent" ? "∅ " : "") + n.name; lblFill = "#4a5a78"; lblCls = "lbl sec"; }
    if (dimNode(n)) op = Math.min(op, .14);

      <label class="field"><span>Mastery basis</span><select data-chg="cfg" data-key="masteryBasis" data-type="str"><option ${CONFIG.masteryBasis === "rank" ? "selected" : ""}>rank</option><option ${CONFIG.masteryBasis === "total" ? "selected" : ""}>total</option></select></label>
      <h4 class="dim tiny" style="margin:10px 0 4px">WEB POINT BANDS</h4>

      <h4 class="dim tiny" style="margin:10px 0 4px">MASTERY TIERS (names referenced by nodes) & PROGRESS DC</h4>
      <table class="t"><tr><th>Name</th><th>Min</th><th>Prog DC</th><th></th></tr>${tierRows}</table><button class="btn sm" data-act="tierAdd" style="margin-top:6px">+ tier</button>
      <label class="field" style="margin-top:10px"><span>Underqualified maneuver guidance</span><input type="text" data-chg="cfg" data-key="underqualifiedPenalty" data-type="str" value="${esc(CONFIG.underqualifiedPenalty)}"></label>

        <div class="row" style="margin-top:6px"><button class="btn sm primary" data-act="cfgApplyJSON">Apply JSON</button><button class="btn sm danger" data-act="cfgReset">Reset to defaults</button></div></details></div>

      ${ch.log.slice(0, 60).map(l => `<div class="small" style="padding:4px 0;border-top:1px solid var(--line)"><span class="faint mono tiny">${new Date(l.t).toLocaleString()}</span> ${esc(l.msg)}</div>`).join("") || `<div class="dim small">Empty.</div>`}

}

/* =====================================================================
   STORAGE — export / import UI
   ===================================================================== */
function showJSON(title, filename, obj) {
  const txt = JSON.stringify(obj, null, 2);
  App.exportData = { filename, txt };
  modal(`<h2>${esc(title)}</h2><p class="dim small">Download the file, or copy the JSON somewhere safe (notes app, email to yourself). Paste it back via Import.</p>
    <div class="row" style="margin-bottom:8px"><button class="btn primary grow" data-act="downloadJSON">Download ${esc(filename)}</button><button class="btn grow" data-act="copyJSON">Copy JSON</button></div>
    <textarea id="jsonOut" readonly>${esc(txt)}</textarea><button class="btn block" style="margin-top:8px" data-act="closeModal">Done</button>`);
}
function importDialog(mode) {
  App.importMode = mode;
  modal(`<h2>${mode === "backup" ? "Import Complete Backup" : "Import Character"}</h2>
    <p class="dim small">${mode === "backup" ? "Restores every character in the backup (existing ones with the same id are replaced) and its configuration." : "Adds the character to your library."} Choose a .json file or paste JSON.</p>
    <input type="file" accept=".json,application/json,text/plain" id="impFile" style="margin-bottom:8px">
    <textarea id="impText" placeholder="…or paste JSON here"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ghost grow" data-act="closeModal">Cancel</button><button class="btn primary grow" data-act="doImport">Import</button></div>`);
  $("#impFile").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $("#impText").value = rd.result; }; rd.readAsText(f); });
}
function doImport() {
  let obj; try { obj = JSON.parse($("#impText").value); } catch (e) { toast("That isn't valid JSON: " + e.message); return; }
  try {
    if (App.importMode === "backup") {
      if (!obj.characters) throw new Error("Not a backup file (no characters).");
      for (const id in obj.characters) App.store.characters[id] = validateCharacter(obj.characters[id]);
      if (obj.config) applyConfig(obj.config);
      saveStore(); closeModal(); toast(`Restored ${Object.keys(obj.characters).length} character(s) and configuration.`); App.screen = "library"; render();
    } else {
      const raw = obj.character || obj; if (obj.characters) throw new Error("This is a complete backup — use Import Complete Backup.");
      const c = validateCharacter(raw);
      if (App.store.characters[c.id]) { c.id = uid(); c.name = (c.name || "Unnamed") + " (imported)"; }
      App.store.characters[c.id] = c; saveStore(); closeModal(); toast(`Imported ${c.name || "character"}.`); render();
    }
  } catch (e) { toast("Import failed: " + e.message); }
}

/* =====================================================================
   UI — ACTIONS (event delegation)
   ===================================================================== */
const kindForKey = { events: "event", associations: "assoc", knowledge: "knowledge", equipment: "equip", augmentations: "aug" };
const draftSetFor = { event: "events", assoc: "assoc", knowledge: "knowledge", equip: "equipment", aug: "aug" };
function openCharacter(id) {
  App.liveId = id; App.planning = null; App.view = null; App.selected = null; App.lastInvalid = [];
  const c = live(); App.screen = c.history.finalized ? "main" : "lifepath"; App.tab = "web";
  App.lpStage = c.history.finalized ? 0 : Math.max(0, LIFEPATH_STAGES.findIndex(s => s.id !== "final" && !c.history[s.id]));
  if (App.lpStage < 0) App.lpStage = 0;
  App.store.settings.lastId = id; saveStore(); $("#sheet").classList.remove("open"); render();
}
function doMark(s) { commit(null, ch => { const m = addProgressMark(ch, s); return `Progress Mark: ${s}` + (m.length ? " — " + m.join(" ") : ""); }); }
function refundWith(id, cascade) {
  commit(null, ch => {
    const gone = [];
    const rm = x => { if (!ch.owned[x]) return; const deps = cascade ? dependentsOf(ch, x) : []; refundNode(ch, x); gone.push(NODE_BY_ID[x].name); deps.forEach(rm); };
    rm(id); return `Refunded ${gone.join(", ")}`;
  });
  closeModal();
}
const ACT = {
  closeModal, confirmOk() { const f = App.pending; closeModal(); if (f) f(); },
  goLibrary() { if (isPlanning()) toast("Planning discarded."); App.planning = null; if (App.liveId && live() && !isPlanning()) saveStore(); App.screen = "library"; $("#sheet").classList.remove("open"); render(); },
  saveNow() { const ok = saveStore(); toast(ok ? "Saved to this browser. Export for a portable copy." : "Browser storage unavailable — use Export to keep this character."); },
  newChar() { const c = newCharacter(); App.store.characters[c.id] = c; saveStore(); openCharacter(c.id); },
  openChar: d => openCharacter(d.id),
  dupChar: d => { const c = clone(App.store.characters[d.id]); c.id = uid(); c.name = (c.name || "Unnamed") + " (copy)"; c.updated = Date.now(); App.store.characters[c.id] = c; saveStore(); toast("Duplicated."); render(); },
  exportChar: d => { const c = App.store.characters[d.id]; showJSON("Export Character", `${(c.name || "character").replace(/[^\w-]+/g, "_")}.buildwright.json`, { buildwright: "character", version: 1, exported: new Date().toISOString(), character: c }); },
  delChar: d => confirmBox("Delete character?", `<p>Delete <b>${esc(App.store.characters[d.id].name || "Unnamed")}</b> from this browser? Export first if you might want it back.</p>`, "Delete", () => { delete App.store.characters[d.id]; saveStore(); render(); }, "danger"),
  importChar: () => importDialog("char"), importBackup: () => importDialog("backup"), doImport,
  exportBackup: () => showJSON("Export Complete Backup", `buildwright-backup-${new Date().toISOString().slice(0, 10)}.json`, { buildwright: "backup", version: 1, exported: new Date().toISOString(), config: CONFIG, characters: App.store.characters }),
  downloadJSON() {
    try { const b = new Blob([App.exportData.txt], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = App.exportData.filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast("Download started. If nothing happened, use Copy JSON."); }
    catch (e) { toast("Download blocked here — use Copy JSON."); }
  },
  copyJSON() {
    const ta = $("#jsonOut"); const done = () => toast("Copied to clipboard.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(App.exportData.txt).then(done, () => { ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Select the text and copy it manually."); } });
    else { ta.focus(); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Select the text and copy it manually."); } }
  },
  resetPrototype: () => confirmBox("Reset prototype?", `<p>This erases <b>every character</b> and all configuration stored in this browser. Export a backup first.</p>`, "Erase everything", () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    App.store = { version: 1, config: null, characters: {}, settings: {} }; Storage_.mem = null; applyConfig(null); saveStore(); App.liveId = null; App.screen = "library"; render(); toast("Prototype reset.");
  }, "danger"),

  // lifepath
  lpGo: d => { App.lpStage = +d.i; App.lastInvalid = []; render(); $("#view").scrollTop = 0; },
  lpPick: d => { const ch = active(); App.lastInvalid = setLifepathChoice(ch, d.stage, d.id); ch.updated = Date.now(); saveStore(); render(); },
  lpNA: () => toast("Unavailable with your current history — the requirements are listed on the card."),
  lpBack: () => { App.lpStage = Math.max(0, App.lpStage - 1); App.lastInvalid = []; render(); $("#view").scrollTop = 0; },
  lpNext: () => { const st = LIFEPATH_STAGES[App.lpStage]; if (!active().history[st.id]) toast("No choice yet for " + st.name + " — you can come back."); App.lpStage = Math.min(LIFEPATH_STAGES.length - 1, App.lpStage + 1); App.lastInvalid = []; render(); $("#view").scrollTop = 0; },
  lpFlex: d => { const ch = active(); ch.history.flex[d.a] = (ch.history.flex[d.a] || 0) + Number(d.d); saveStore(); render(); },
  lpReview: () => { App.screen = "review"; render(); $("#view").scrollTop = 0; },
  reviewBack: () => { App.screen = "lifepath"; render(); },
  createChar: () => confirmBox(active().history.finalized ? "Re-finalize history?" : "Create character?", `<p>Foundational history becomes read-only in normal mode. (Developer override can still unlock it.)</p>`, "CREATE CHARACTER", () => {
    const ch = active(); const first = !ch.history.everFinalized;
    ch.history.finalized = true; ch.history.everFinalized = true;
    if (first) { ch.level = Math.max(1, Math.min(CONFIG.levelCap, Number(ch.history.startingLevel) || 1)); ch.owned = {}; }
    markSeenNow(ch); logChar(ch, first ? `Character created at level ${ch.level} with ${webPoints(ch).earned} Web Points.` : "Lifepath history edited and re-finalized (override).");
    saveStore(); App.screen = "main"; App.tab = "web"; App.view = null; render(); toast(first ? "Character created. Tap a glowing node to spend Web Points." : "History re-finalized.");
  }, "primary"),

  // main navigation
  tab: d => { App.tab = d.tab; if (d.tab !== "web") { $("#sheet").classList.remove("open"); App.selected = null; } render(); },
  closeSheet, openNode: d => { App.tab = "web"; App.selected = d.id; render(); selectNode(d.id); },
  zoom: d => { const w = $("#webwrap"); if (w && w._zoom) w._zoom(Number(d.f)); },
  fit: () => { const w = $("#webwrap"); if (w && w._fit) w._fit(); },
  legend: () => { App.filters.legend = !App.filters.legend; render(); },

  // sheet
  level: d => { const ch = active(); const to = Math.max(1, Math.min(CONFIG.levelCap, ch.level + Number(d.d))); if (to === ch.level) return toast("Level cap is " + CONFIG.levelCap + "."); const gain = to > ch.level ? perLevelWP(to) : -perLevelWP(ch.level);
    commit(null, c => { c.level = to; return `Level ${to} (${signed(gain)} WP)`; }); },
  manFav: () => { App.man.favOnly = !App.man.favOnly; render(); },
  manStar: d => { const ch = active(); const i = ch.favorites.indexOf(d.k); i >= 0 ? ch.favorites.splice(i, 1) : ch.favorites.push(d.k); if (!isPlanning()) saveStore(); render(); },
  manPin: d => { const ch = active(); const i = ch.pinned.indexOf(d.k); i >= 0 ? ch.pinned.splice(i, 1) : ch.pinned.push(d.k); if (!isPlanning()) saveStore(); render(); },

  // skills
  mark: d => {
    const s = d.s; const ch = active();
    if (Number(d.d) < 0) return commit(`Removed Progress Mark: ${s}`, c => removeProgressMark(c, s), { quiet: true });
    const D = deriveCharacter(ch); const warn = [];
    if (D.skills[s].markedSinceRest && CONFIG.maxMarksBetweenLongRests <= 1) warn.push(`${esc(s)} already earned a Progress Mark since the last long rest (limit ${CONFIG.maxMarksBetweenLongRests}).`);
    if (!D.skills[s].unlock.ok) warn.push(`${esc(s)} is not unlocked yet (${esc(SKILL_BY_ID[s].note || "")}).`);
    if (warn.length) return confirmBox("Add Progress Mark anyway?", `<p>${warn.join("<br>")}</p><p class="dim small">Buildwright warns but doesn't police the table.</p>`, "Add anyway", () => doMark(s), "warn");
    doMark(s);
  },
  rank: d => commit(`${d.s} rank ${signed(Number(d.d))} (manual)`, c => changeRank(c, d.s, Number(d.d))),
  skillTrained: () => { App.skillTrained = !App.skillTrained; render(); },
  longRest: () => commit("Long rest — Progress Mark eligibility reset", c => longRest(c)),

  // state
  stAdd: d => { const v = $("#add_" + d.key).value; if (!v) return toast("Choose something to add first."); const kind = kindForKey[d.key];
    commit(null, c => { const key = kind + ":" + v; if (c.state.removed.includes(key)) c.state.removed = c.state.removed.filter(x => x !== key); else c.state[d.key].push(v);
      return `${kind === "event" ? "Event" : "Added"}: ${(EVENT_BY_ID[v] || ACCESS_BY_ID[v]).name}`; }); },
  stRemove: d => commit(null, c => { const lp = buildLifepath(c.history).draft; c.state[d.key] = c.state[d.key].filter(x => x !== d.id);
    if (lp[draftSetFor[d.kind]].has(d.id)) c.state.removed.push(d.kind + ":" + d.id); return `Removed: ${(EVENT_BY_ID[d.id] || ACCESS_BY_ID[d.id] || { name: d.id }).name}`; }),
  stRestore: d => commit(null, c => { c.state.removed = c.state.removed.filter(x => x !== d.kind + ":" + d.id); return `Restored: ${(EVENT_BY_ID[d.id] || ACCESS_BY_ID[d.id] || { name: d.id }).name}`; }),
  tagAdd: () => { const v = ($("#tagInput").value || "").trim().replace(/\s+/g, "_"); if (!v) return; commit(`Tag added: #${v}`, c => { if (!c.state.tags.includes(v)) c.state.tags.push(v); }); },
  tagRemove: d => commit(`Tag removed: #${d.t}`, c => { c.state.tags = c.state.tags.filter(x => x !== d.t); }),

  // inspector
  buy: () => { const id = App.selected; const ch = active(); const D = deriveCharacter(ch); const chk = purchaseCheck(ch, id, evaluateWeb(ch, D), D);
    if (chk.ok) commit(null, c => purchaseNode(c, id));
    else confirmBox("Purchase anyway?", `<p>${chk.reasons.map(esc).join("<br>")}</p><p class="dim small">This records a forced (override) purchase. Banked points may go negative.</p>`, "Purchase anyway", () => commit(null, c => purchaseNode(c, id, true)), "danger"); },
  forceBuy: () => commit(null, c => purchaseNode(c, App.selected, true)),
  refund: () => { const id = App.selected; const ch = active(); const deps = dependentsOf(ch, id);
    const rule = CONFIG.respecMode === "disabled" ? `<p class="warn">Respec is disabled at this table (CONFIG.respecMode). Refunding anyway is a DM override.</p>` : "";
    App.refundId = id;
    modal(`<h2>Refund ${esc(NODE_BY_ID[id].name)}?</h2>${rule}<p>Returns ${ch.owned[id].cost} WP.</p>
      ${deps.length ? `<p class="warn">Depends on it: ${deps.map(x => esc(labelFor("node", x))).join(", ")}. Refunding only this leaves them orphaned (still owned).</p>` : ""}
      <div class="row"><button class="btn ghost grow" data-act="closeModal">Cancel</button><button class="btn warn grow" data-act="refundDo" data-c="0">Refund this only</button>
      ${deps.length ? `<button class="btn danger grow" data-act="refundDo" data-c="1">Refund with dependents</button>` : ""}</div>`); },
  refundDo: d => refundWith(App.refundId, d.c === "1"),
  nodeStar: () => { const ch = active(); const k = "node:" + App.selected; const i = ch.favorites.indexOf(k); i >= 0 ? ch.favorites.splice(i, 1) : ch.favorites.push(k); if (!isPlanning()) saveStore(); renderInspector(); },
  nodePin: () => { const ch = active(); const k = "node:" + App.selected; const i = ch.pinned.indexOf(k); i >= 0 ? ch.pinned.splice(i, 1) : ch.pinned.push(k); if (!isPlanning()) saveStore(); renderInspector(); },
  nodeOv: d => commit(`Override: ${labelFor("node", App.selected)} → ${d.ov || "cleared"}`, c => { if (d.ov) c.overrides.nodes[App.selected] = d.ov; else delete c.overrides.nodes[App.selected]; }),

  // planning
  planEnter: () => { App.planning = clone(live()); App.tab = "plan"; toast("Planning Mode — a hypothetical copy. Your live character is untouched."); render(); },
  planReset: () => { App.planning = clone(live()); toast("Plan reset to live character."); render(); },
  planExit: () => { App.planning = null; toast("Back to your LIVE character."); render(); },
  planApply: () => confirmBox("Apply plan to live character?", `<p>This <b>replaces</b> the live character with the planning copy (purchases, level, events, skills). Only do this if the DM agrees.</p>`, "Apply to live", () => {
    const p = clone(App.planning); p.id = App.liveId; logChar(p, "Applied planning changes to live character."); App.store.characters[App.liveId] = p; App.planning = null; saveStore(); toast("Plan applied."); render(); }, "danger"),
  planWP: d => commit(`[Plan] bonus WP ${signed(Number(d.d))}`, c => { c.bonusWP = Number(c.bonusWP) + Number(d.d); }, { quiet: true }),

  // dev
  devSetLevel: () => ACT.devLevel({ v: $("#devLevel").value }),
  devLevel: d => { const v = Math.max(1, Math.min(CONFIG.levelCap, Number(d.v) || 1)); commit(`Level set to ${v} (override)`, c => { c.level = v; }); },
  devWP: d => commit(`Bonus Web Points ${signed(Number(d.d))} (override)`, c => { c.bonusWP = Number(c.bonusWP || 0) + Number(d.d); }),
  devAttr: d => commit(`${d.a} override ${signed(Number(d.d))}`, c => { c.overrides.attrs[d.a] = (c.overrides.attrs[d.a] || 0) + Number(d.d); }),
  devSetSkill: () => { const s = $("#devSkill").value, v = Number($("#devSkillRank").value); commit(`${s} rank set to ${v} (override)`, c => { const lpR = buildLifepath(c.history).draft.skills[s] || 0; skillState(c, s).gained = v - lpR; }); },
  devNodeAct: d => { const id = App.devNode; if (!id) return toast("Choose a node first.");
    if (d.op === "inspect") return ACT.openNode({ id });
    if (d.op === "buy") return commit(null, c => purchaseNode(c, id, true));
    if (d.op === "remove") return commit(null, c => refundNode(c, id));
    commit(`Override: ${labelFor("node", id)} → ${d.op === "clear" ? "cleared" : d.op}`, c => { if (d.op === "clear") delete c.overrides.nodes[id]; else c.overrides.nodes[id] = d.op; }); },
  devRevealAll: () => commit("Force-revealed all nodes", c => NODES.forEach(n => c.overrides.nodes[n.id] = "reveal")),
  devClearOv: () => commit("Cleared all node overrides", c => { c.overrides.nodes = {}; }),
  recalcWeb: () => commit("Recalculated Web", () => {}),
  resetWeb: () => confirmBox("Reset Web?", "<p>Removes every purchased node, seen-history and override. Skills, events and history stay.</p>", "Reset Web", () => commit("Web reset", c => { c.owned = {}; c.seen = []; c.overrides.nodes = {}; c.respec.cap = null; }), "danger"),
  respecAll: () => confirmBox("Respec all nodes?", `<p>Refunds every node. Mode <b>${esc(CONFIG.respecMode)}</b>${CONFIG.respecMode === "depthLimited" ? ": you can't rebuy deeper into a domain than you had reached (override still possible)" : ""}.</p>`, "Respec", () => commit(null, c => respecAll(c)), "warn"),
  clearRespec: () => commit("Respec depth cap cleared", c => { c.respec.cap = null; }),
  unlockHistory: () => confirmBox("Unlock Lifepath history?", "<p>DM/developer override. Edits rebuild attributes, lifepath skills and lifepath access. Purchased nodes and play progress stay.</p>", "Unlock", () => { if (isPlanning()) App.planning = null; App.screen = "lifepath"; App.lpStage = 0; render(); }, "danger"),
  bandAdd: () => { const b = CONFIG.webPointBands; const l = b[b.length - 1] || { max: 0, perLevel: 5 }; b.push({ min: l.max + 1, max: l.max + 5, perLevel: l.perLevel }); saveStore(); render(); },
  bandDel: d => { CONFIG.webPointBands.splice(+d.i, 1); saveStore(); render(); },
  tierAdd: () => { const t = CONFIG.masteryTiers; const l = t[t.length - 1]; t.push({ name: "Tier" + (t.length + 1), min: l.min + 10 }); saveStore(); render(); },
  tierDel: d => { CONFIG.masteryTiers.splice(+d.i, 1); saveStore(); render(); },
  cfgApplyJSON: () => { try { applyConfig(JSON.parse($("#cfgJson").value)); saveStore(); toast("Configuration applied."); render(); } catch (e) { toast("Invalid JSON: " + e.message); } },
  cfgReset: () => confirmBox("Reset configuration?", "<p>Restores every PLAYTEST VALUE (bands, tiers, node price edits…) to the file's defaults.</p>", "Reset", () => { applyConfig(null); saveStore(); render(); toast("Configuration reset."); }, "danger"),
  clearLog: () => { active().log = []; if (!isPlanning()) saveStore(); render(); }
};
const CHG = {
  lpName: v => { active().name = v; saveStore(); renderTop(); },
  lpAge: v => { active().history.age = v; saveStore(); },
  lpLevel: v => { active().history.startingLevel = Math.max(1, Math.min(CONFIG.levelCap, Number(v) || 1)); saveStore(); render(); },
  charName: v => { active().name = v; if (!isPlanning()) saveStore(); renderTop(); },
  webDom: v => { App.filters.domain = v; redrawWeb(); },
  showHidden: (v, d, el) => { App.filters.showHidden = el.checked; render(); },
  manDom: v => { App.man.domain = v; render(); }, manKind: v => { App.man.kind = v; render(); },
  nodeCost: v => { const n = NODE_BY_ID[App.selected]; if (Number(v) === n.cost) delete CONFIG.costOverrides[n.id]; else CONFIG.costOverrides[n.id] = Number(v); saveStore(); toast(`${n.name} now costs ${nodeCost(n)} (config).`); render(); },
  planLevel: v => commit(`[Plan] level → ${v}`, c => { c.level = Number(v); }, { quiet: true }),
  devNode: v => { App.devNode = v; }, dbgNode: v => { App.dbgNode = v; render(); },
  cfg: (v, d, el) => { CONFIG[d.key] = d.type === "num" ? Number(v) : d.type === "bool" ? el.checked : v; applyConfig(CONFIG); saveStore(); render(); toast(`${d.key} = ${JSON.stringify(CONFIG[d.key])}`); },
  band: (v, d) => { CONFIG.webPointBands[+d.i][d.f] = Number(v); saveStore(); render(); },
  tier: (v, d) => { const t = CONFIG.masteryTiers[+d.i]; if (d.f === "name") { const old = t.name; t.name = v; if (CONFIG.progressDCByTier[old] !== undefined) { CONFIG.progressDCByTier[v] = CONFIG.progressDCByTier[old]; delete CONFIG.progressDCByTier[old]; } } else t.min = Number(v); saveStore(); render(); },
  pdc: (v, d) => { CONFIG.progressDCByTier[d.tier] = Number(v); saveStore(); render(); }
};
const INP = {
  webQ: v => { App.filters.search = v; redrawWeb(); },
  skillQ: v => { App.skillQ = v; const ch = active(); $("#skillList").innerHTML = skillListHtml(ch, deriveCharacter(ch)); },
  manQ: v => { App.man.q = v; const ch = active(); $("#manList").innerHTML = manListHtml(ch, deriveCharacter(ch)); }
};

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  App.store = Storage_.load();
  App.store.characters = App.store.characters || {}; App.store.settings = App.store.settings || {};
  for (const id in App.store.characters) { try { App.store.characters[id] = validateCharacter(App.store.characters[id]); } catch (e) { delete App.store.characters[id]; } }
  applyConfig(App.store.config);
  document.addEventListener("click", e => {
    if (e.target.id === "modal") return closeModal();
    const el = e.target.closest("[data-act]"); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    e.preventDefault(); try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast("Error: " + err.message); }
  });
  document.addEventListener("change", e => { const el = e.target.closest("[data-chg]"); if (!el) return; const fn = CHG[el.dataset.chg];
    if (fn) { try { fn(el.value, el.dataset, el); } catch (err) { console.error(err); toast("Error: " + err.message); } } });
  document.addEventListener("input", e => { const el = e.target.closest("[data-inp]"); if (!el) return; const fn = INP[el.dataset.inp]; if (fn) fn(el.value, el.dataset, el); });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (App.screen === "main" && App.tab === "web") redrawWeb(); }, 150); });
  window.addEventListener("error", e => toast("Error: " + e.message));
  render();
}
boot();
</script>
</body>
</html>
